<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kapaklar: Bir Sayfanın Yolculuğu</title>
</head>
<body>
<div id="root"></div>
<script type="module">
// YouTube kapakları. Ana görsel filmin kendi karesi: thumb/hero-<saniye×10>.jpg, filmin renderAt'ı ile
// ekrandaki yazılar kapatılarak alındı (thumb/grab.mjs). Kanal katmanı assets/thumbnail-kit/kit.js'ten.
//   v=1 ana kapak · v=2 ve v=3 A/B denemesi için
import * as kit from '/_kit/kit.js';

const CONCEPTS = [
  // yarım ton portre: fotoğrafta tek gri nokta yok
  { id: 'gri-yok', img: 'hero-0195', title: '*GRİ* YOK', accent: 'Yazıcı bir fotoğrafı nasıl basar?',
    hero: { focus: [0.54, 0.46], at: [0.68, 0.47], zoom: 1.1 }, scrim: 0.9 },
  // lazer, dönen ayna ve tambur: sayfa ışıkla yazılır
  { id: 'murekkep-yok', img: 'hero-1270', title: 'MÜREKKEP *YOK*', accent: 'Lazer yazıcı sayfayı ışıkla yazar',
    hero: { focus: [0.55, 0.44], at: [0.73, 0.47], zoom: 1.5 }, scrim: 0.75 },
  // kaynaştırıcı silindir: sayfanın sıcaklığı buradan
  { id: 'sayfa-sicak', img: 'hero-1785', title: 'SAYFA NEDEN *SICAK?*', accent: 'Lazer yazıcının içinde bir sayfa',
    hero: { focus: [0.48, 0.4], at: [0.7, 0.42], zoom: 1.2 }, scrim: 0.75 },
];

const v = Math.max(1, Math.min(CONCEPTS.length, Number(new URLSearchParams(location.search).get('v')) || 1));
const c = CONCEPTS[v - 1];

const img = new Image();
img.src = `thumb/${c.img}.jpg`;
await img.decode();
kit.hero(kit.layer(1), img, c.hero);

kit.brand({ title: c.title, accent: c.accent, category: 'technology', scrim: c.scrim });
await kit.ready();
window.__thumbs = { count: CONCEPTS.length, list: CONCEPTS.map(x => ({ id: x.id, title: x.title.replace(/\*/g, '') })) };
window.__thumbReady = true;
</script>
</body>
</html>

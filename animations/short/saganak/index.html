<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sağanak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#000}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#000;color:#e9dfcf;font-family:'Cormorant Garamond',Georgia,serif;cursor:pointer;transition:opacity 1s ease;user-select:none}
  #start .ttl{font-weight:300;font-size:clamp(28px,5vw,64px);letter-spacing:.45em;margin-left:.45em}
  #start .play{margin-top:34px;width:64px;height:64px;border:1px solid rgba(233,223,207,.5);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px;box-sizing:border-box;transition:transform .4s ease,background .4s}
  #start:hover .play{transform:scale(1.08);background:rgba(233,223,207,.08)}
  #start .hint{margin-top:26px;font-size:15px;letter-spacing:.12em;opacity:.55;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="start">
  <div class="ttl">SAĞANAK</div>
  <div class="play">▶</div>
  <div class="hint">izlemek için tıkla · sesi aç<br>F tam ekran · boşluk duraklat · R baştan</div>
</div>
<script>
'use strict';
if (/[?&](t|audiotest)=?/.test(location.search)) window.onerror = (m, s, l, c, e) => { document.title = 'ERR ' + m + ' @' + l + ':' + c; };
/* =========================================================================
   SAĞANAK — kodla yapılmış kısa film (Canvas 2D + Web Audio, harici varlık yok)
   ========================================================================= */
const W = 1280, H = 720, TAU = Math.PI * 2, END = 71.8;
const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const bgc = document.createElement('canvas'), bgctx = bgc.getContext('2d');
const buf = document.createElement('canvas'), bctx = buf.getContext('2d');
let K = 1, vignette = null, grainPat = null;

/* ---------------- math ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => t * t * (3 - 2 * t);
const E = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  o: t => 1 - Math.pow(1 - t, 3),
  i: t => t * t * t,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const seg = (t, a, b, e = sm) => e(clamp((t - a) / (b - a)));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function vnoise(x) { const i = Math.floor(x), f = x - i; return lerp(hash(i), hash(i + 1), f * f * (3 - 2 * f)) * 2 - 1; }
const fbm = x => vnoise(x) * .6 + vnoise(x * 2.3 + 7.1) * .3 + vnoise(x * 5.1 + 3.3) * .1;
const spring = (t, t0, a, f = 9, d = 5) => t < t0 ? 0 : a * Math.exp(-d * (t - t0)) * Math.sin(f * (t - t0));

// Hermite spline through [t, v1, v2, ...] keys — no linear motion anywhere
function spline(keys, t) {
  const n = keys.length;
  if (t <= keys[0][0]) return keys[0].slice(1);
  if (t >= keys[n - 1][0]) return keys[n - 1].slice(1);
  let i = 0; while (keys[i + 1][0] < t) i++;
  const k0 = keys[Math.max(0, i - 1)], k1 = keys[i], k2 = keys[i + 1], k3 = keys[Math.min(n - 1, i + 2)];
  const dt = k2[0] - k1[0], u = (t - k1[0]) / dt, u2 = u * u, u3 = u2 * u;
  const out = [];
  for (let d = 1; d < k1.length; d++) {
    const m1 = (k2[d] - k0[d]) / ((k2[0] - k0[0]) || 1) * dt;
    const m2 = (k3[d] - k1[d]) / ((k3[0] - k1[0]) || 1) * dt;
    out.push((2 * u3 - 3 * u2 + 1) * k1[d] + (u3 - 2 * u2 + u) * m1 + (-2 * u3 + 3 * u2) * k2[d] + (u3 - u2) * m2);
  }
  return out;
}
// eased step keys: [time, duration, v...]
function steps(keys, t) {
  let c = keys[0].slice(2);
  for (let i = 1; i < keys.length; i++) {
    const k = keys[i]; if (t < k[0]) break;
    const u = E.io(clamp((t - k[0]) / k[1]));
    c = c.map((v, j) => v + (k[j + 2] - v) * u);
  }
  return c;
}
// smooth keyframes [time, value]
function kf(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++)
    if (t <= keys[i + 1][0]) return lerp(keys[i][1], keys[i + 1][1], sm((t - keys[i][0]) / (keys[i + 1][0] - keys[i][0])));
  return keys[keys.length - 1][1];
}

/* ---------------- color ---------------- */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function pal(o) { const r = {}; for (const k in o) r[k] = typeof o[k] === 'string' ? hex(o[k]) : [o[k]]; return r; }
const PALS = {
  DRY: pal({ skyTop: '#b3331f', skyMid: '#e8723a', skyBot: '#ffcb8c', sun: '#fff6dc', sunGlow: '#ffd98a', sunA: 1,
    far: '#e3976c', mid: '#c65c32', midShade: '#98401f', near: '#b0461f', nearShade: '#6a220f', nearLit: '#ee8a4e',
    ground: '#d67a41', groundFar: '#f2b47c', groundDark: '#9a4422', crack: '#561808', haze: '#ffd29a',
    cloudLit: '#fffaf1', cloudShade: '#f3bc9c', eye: '#3a1d1f', blush: '#ff8f84', rain: '#ffffff' }),
  DUSK: pal({ skyTop: '#2a2262', skyMid: '#8c3a6c', skyBot: '#f2784c', sun: '#ffd6a8', sunGlow: '#ff8656', sunA: .7,
    far: '#915672', mid: '#7c3a50', midShade: '#55253e', near: '#5e2a3c', nearShade: '#33162e', nearLit: '#c05e58',
    ground: '#8f4a44', groundFar: '#c97c66', groundDark: '#5b2a34', crack: '#281020', haze: '#e8927a',
    cloudLit: '#ffe6dd', cloudShade: '#b48cb8', eye: '#2a1830', blush: '#ff8aa0', rain: '#ffffff' }),
  STORM: pal({ skyTop: '#0c0a28', skyMid: '#221e5a', skyBot: '#473c8c', sun: '#8a84d0', sunGlow: '#3a3480', sunA: 0,
    far: '#37336f', mid: '#2c2762', midShade: '#1d1a48', near: '#241f50', nearShade: '#120f2e', nearLit: '#5a52a0',
    ground: '#302b66', groundFar: '#4c4589', groundDark: '#1b173e', crack: '#0d0b22', haze: '#5c55a4',
    cloudLit: '#cdc8f4', cloudShade: '#463e8c', eye: '#141030', blush: '#9282dc', rain: '#d8d4ff' }),
  CLEAR: pal({ skyTop: '#2c7cc2', skyMid: '#8bc6e6', skyBot: '#ffe0a4', sun: '#fff4d0', sunGlow: '#ffcf78', sunA: .9,
    far: '#a2bccb', mid: '#b67c5c', midShade: '#86533f', near: '#9a5a3c', nearShade: '#562f22', nearLit: '#f4a864',
    ground: '#7a4a34', groundFar: '#b88f6c', groundDark: '#4c2b1f', crack: '#28150d', haze: '#ffe6bd',
    cloudLit: '#ffffff', cloudShade: '#c6d5f2', eye: '#2a2040', blush: '#ff9fb4', rain: '#ffffff' }),
};
const PK = [[0, 'DRY'], [29.5, 'DRY'], [35.5, 'DUSK'], [40.5, 'STORM'], [51, 'STORM'], [55.5, 'CLEAR']];
function palAt(t) {
  let i = 0; while (i < PK.length - 1 && t > PK[i + 1][0]) i++;
  if (i >= PK.length - 1) return PALS[PK[PK.length - 1][1]];
  const a = PK[i], b = PK[i + 1]; if (a[1] === b[1]) return PALS[a[1]];
  const u = sm(clamp((t - a[0]) / (b[0] - a[0]))), A = PALS[a[1]], B = PALS[b[1]], o = {};
  for (const k in A) o[k] = mixc(A[k], B[k], u);
  return o;
}
const GR = { far: hex('#9ad693'), mid: hex('#35b06a'), near: hex('#12804e'), front: hex('#ffe9a0'),
  wallTop: hex('#79c47c'), wallBot: hex('#2b7650'), midG: hex('#5f9c6c'), farG: hex('#93bfa4') };
const FCOL = ['#ff4f9a', '#ffd23f', '#fff5ea', '#ff7a4d', '#b56cff', '#ff9fcb', '#5fc8ff'];

/* ---------------- world geometry (precomputed Path2D) ---------------- */
const R0 = mulberry32(20260927);
const rr = (a, b) => a + (b - a) * R0();

const SLK = [[320, 0], [420, -22], [560, -90], [760, -228], [980, -400], [1200, -590], [1420, -780], [1620, -930], [1800, -1010], [2100, -1060], [5200, -1110]];
function slopeBase(x) {
  if (x <= SLK[0][0]) return 0;
  for (let i = 0; i < SLK.length - 1; i++) { const a = SLK[i], b = SLK[i + 1]; if (x <= b[0]) { const u = (x - a[0]) / (b[0] - a[0]); return lerp(a[1], b[1], sm(u) * .5 + u * .5); } }
  return SLK[SLK.length - 1][1];
}
const slopeY = x => slopeBase(x) + (x > 330 ? (fbm(x * .008) * 22 + vnoise(x * .05) * 5) * clamp((x - 330) / 90) : 0);

const LWK = [[-5200, -1250], [-1500, -1215], [-1330, -1170], [-1240, -1080], [-1190, -940], [-1150, -900], [-1120, -760], [-1060, -700], [-1040, -560], [-1000, -500], [-990, -330], [-950, -280], [-930, -150], [-905, -90], [-890, 0]];
const P_LEFT = new Path2D(), P_SLOPE = new Path2D(), P_WALLS = new Path2D(), P_RIM = new Path2D();
(function () {
  const pts = [];
  for (let i = 0; i < LWK.length - 1; i++) {
    const a = LWK[i], b = LWK[i + 1], n = i === 0 ? 60 : 7;
    for (let j = 0; j < n; j++) {
      const u = j / n; let x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u);
      if (i > 0) { x += (R0() - .5) * 12; y += (R0() - .5) * 6; } else y += vnoise(x * .01) * 16;
      pts.push([x, y]);
    }
  }
  pts.push(LWK[LWK.length - 1]);
  P_LEFT.moveTo(-5200, 90); pts.forEach(p => P_LEFT.lineTo(p[0], p[1])); P_LEFT.lineTo(-890, 90); P_LEFT.closePath();
  let first = true; pts.forEach(p => { if (p[0] > -1700) { if (first) { P_RIM.moveTo(p[0], p[1]); first = false; } else P_RIM.lineTo(p[0], p[1]); } });
  P_SLOPE.moveTo(300, 90); P_SLOPE.lineTo(300, 0);
  P_RIM.moveTo(330, slopeY(330));
  for (let x = 320; x <= 5200; x += 10) { const y = slopeY(x); P_SLOPE.lineTo(x, y); if (x > 330 && x < 2600) P_RIM.lineTo(x, y); }
  P_SLOPE.lineTo(5200, 90); P_SLOPE.closePath();
  P_WALLS.addPath(P_LEFT); P_WALLS.addPath(P_SLOPE);
})();

// sandstone strata bands
function strataPath(y0, y1, gap, seed) {
  const p = new Path2D(), r = mulberry32(seed);
  for (let y = y0; y > y1; y -= gap + r() * gap * .6) {
    const th = 5 + r() * 12, ph = r() * 20;
    p.moveTo(-5200, y);
    for (let x = -5200; x <= 5200; x += 80) p.lineTo(x, y + Math.sin(x * .004 + ph) * 7 + vnoise(x * .012 + ph) * 6);
    for (let x = 5200; x >= -5200; x -= 80) p.lineTo(x, y + th + Math.sin(x * .004 + ph) * 7 + vnoise(x * .012 + ph + 3) * 4);
    p.closePath();
  }
  return p;
}
const P_STRATA = strataPath(-20, -1300, 34, 5), P_STRATA2 = strataPath(-40, -1300, 55, 9);

// mid canyon walls (parallax .55)
const P_MID = new Path2D();
(function () {
  const L = [[-5000, -980], [-1400, -960], [-1200, -900], [-1100, -950], [-900, -880], [-830, -700], [-780, -650], [-730, -420], [-690, -380], [-665, -120], [-640, 0]];
  const Rr = [[380, 0], [398, -190], [432, -250], [468, -560], [520, -625], [640, -640], [900, -665], [1180, -700], [1340, -690], [1420, -770], [1470, -1010], [1540, -1025], [1590, -770], [1720, -720], [5000, -770]];
  const add = (arr, a, b) => {
    P_MID.moveTo(a[0], a[1]);
    for (let i = 0; i < arr.length - 1; i++) {
      const p = arr[i], q = arr[i + 1], n = Math.max(2, Math.floor(Math.hypot(q[0] - p[0], q[1] - p[1]) / 30));
      for (let j = 0; j < n; j++) { const u = j / n; P_MID.lineTo(lerp(p[0], q[0], u) + (R0() - .5) * 7, lerp(p[1], q[1], u) + (R0() - .5) * 7); }
    }
    P_MID.lineTo(arr[arr.length - 1][0], arr[arr.length - 1][1]); P_MID.lineTo(b[0], b[1]); P_MID.closePath();
  };
  add(L, [-5000, 1500], [-640, 1500]);
  add(Rr, [380, 1500], [5000, 1500]);
})();
const P_MIDSTRATA = strataPath(-30, -1100, 40, 21);

// far mesas (parallax .25)
const P_FAR = new Path2D();
(function () {
  let x = -6000; P_FAR.moveTo(x, 1500); P_FAR.lineTo(x, -80);
  while (x < 6000) {
    x += rr(150, 600); P_FAR.lineTo(x, -60 - rr(0, 50));
    const h = rr(220, 640), mw = rr(180, 700);
    P_FAR.lineTo(x + rr(20, 60), -h * rr(.45, .7)); P_FAR.lineTo(x + rr(70, 110), -h);
    const x2 = x + mw; for (let xx = x + 110; xx < x2; xx += 40) P_FAR.lineTo(xx, -h + vnoise(xx * .05) * 8);
    P_FAR.lineTo(x2 + rr(20, 60), -h * rr(.4, .6)); x = x2 + rr(80, 160); P_FAR.lineTo(x, -70);
  }
  P_FAR.lineTo(6000, 1500); P_FAR.closePath();
})();

// cracked earth: jittered mesh
const CHUNK = 300;
function strokeMesh(bands, i) {
  const x0 = cam.x - W / 2 / cam.z - 60, x1 = cam.x + W / 2 / cam.z + 60, arr = bands[i];
  for (let c = 0; c < arr.length; c++) { const cx = bands.x0 + c * CHUNK; if (cx + CHUNK >= x0 && cx <= x1) ctx.stroke(arr[c]); }
}
// dual of a jittered triangulation -> irregular polygonal mud cells
function crackMesh(x0, x1, sx, yMax, dyf, jit, seed) {
  const r = mulberry32(seed), G = [];
  let y = -dyf(0) * .5;
  while (y < yMax) { const dy = dyf(Math.max(0, y)), row = []; for (let x = x0; x <= x1; x += sx) row.push([x + (r() - .5) * sx * jit, y + (r() - .5) * dy * .7]); G.push(row); y += dy; }
  const cent = (a, b, c) => [(a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3], cen = [];
  for (let i = 0; i < G.length - 1; i++) {
    const row = [];
    for (let j = 0; j < G[i].length - 1; j++) {
      const a = G[i][j], b = G[i][j + 1], c = G[i + 1][j], d = G[i + 1][j + 1];
      row.push((i + j) % 2 === 0 ? [cent(a, b, d), cent(a, d, c)] : [cent(a, b, c), cent(b, d, c)]);
    }
    cen.push(row);
  }
  const NC = Math.ceil((x1 - x0) / CHUNK) + 1, bands = [0, 1, 2].map(() => Array.from({ length: NC }, () => new Path2D()));
  bands.x0 = x0;
  const bandOf = yy => yy < 60 ? 0 : yy < 260 ? 1 : 2;
  const edge = (p, q) => {
    if (r() < .07 || (p[1] < 0 && q[1] < 0)) return;
    const B = bands[bandOf(Math.max(p[1], q[1]))][clamp(Math.floor((p[0] - x0) / CHUNK), 0, NC - 1)], mx = (p[0] + q[0]) / 2 + (r() - .5) * sx * .14, my = (p[1] + q[1]) / 2 + (r() - .5) * 1.5;
    B.moveTo(p[0], Math.max(0, p[1])); B.lineTo(mx, Math.max(0, my)); B.lineTo(q[0], Math.max(0, q[1]));
  };
  for (let i = 0; i < cen.length; i++) for (let j = 0; j < cen[i].length; j++) {
    const ev = (i + j) % 2 === 0, [T0, T1] = cen[i][j];
    edge(T0, T1);
    if (j + 1 < cen[i].length) edge(ev ? T0 : T1, (i + j + 1) % 2 === 0 ? cen[i][j + 1][1] : cen[i][j + 1][0]);
    if (i + 1 < cen.length) edge(T1, cen[i + 1][j][0]);
  }
  return bands;
}
const CRACKS = crackMesh(-2600, 2600, 44, 900, y => 4 + y * .075, .7, 3);
const FINE = crackMesh(-170, 170, 8.5, 120, y => 2.6 + y * .035, .8, 4);
const P_PEB_L = new Path2D(), P_PEB_D = new Path2D();
for (let i = 0; i < 260; i++) {
  const x = rr(-130, 130), y = rr(3, 95), r = rr(.3, 1.5), p = R0() < .5 ? P_PEB_L : P_PEB_D;
  if (Math.abs(x) < 6 && y > 34 && y < 46) continue;
  p.moveTo(x + r, y); p.ellipse(x, y, r, r * .7, 0, 0, TAU);
}
// boulders
const ROCKS = [[-640, 28, 26], [-470, 150, 42], [390, 64, 30], [540, 250, 58], [-310, 410, 74], [900, 110, 40], [-760, 290, 60], [240, 520, 92], [-1060, 90, 50], [1200, 330, 70], [-150, 20, 10], [150, 30, 8]];
const P_ROCK = new Path2D(), P_ROCKLIT = new Path2D(), P_ROCKSH = new Path2D();
ROCKS.forEach(([x, y, r]) => {
  const n = 9, pts = [];
  for (let i = 0; i < n; i++) { const a = Math.PI + i / (n - 1) * Math.PI, rad = r * rr(.78, 1.08); pts.push([x + Math.cos(a) * rad * 1.1, y + Math.sin(a) * rad * .72]); }
  P_ROCK.moveTo(pts[0][0], y); pts.forEach(p => P_ROCK.lineTo(p[0], p[1])); P_ROCK.lineTo(pts[n - 1][0], y + r * .08); P_ROCK.closePath();
  P_ROCKLIT.moveTo(pts[1][0] + r * .1, pts[1][1] + r * .15); for (let i = 2; i < n - 3; i++) P_ROCKLIT.lineTo(pts[i][0], pts[i][1] + r * .05); P_ROCKLIT.lineTo(x + r * .2, y - r * .35); P_ROCKLIT.closePath();
  P_ROCKSH.moveTo(x + r * 1.4, y + r * .05); P_ROCKSH.ellipse(x + r * .25, y + r * .05, r * 1.25, r * .16, 0, 0, TAU);
});
// foreground silhouettes (parallax 1.35)
const P_FG = new Path2D();
[[-980, 150, 170], [-420, 185, 120], [560, 160, 190], [1380, 175, 150], [-1700, 170, 200]].forEach(([x, y, r]) => {
  P_FG.moveTo(x - r * 1.3, 900);
  for (let i = 0; i <= 12; i++) { const a = Math.PI + i / 12 * Math.PI; P_FG.lineTo(x + Math.cos(a) * r * 1.3 * rr(.85, 1.05), y + Math.sin(a) * r * .5 * rr(.8, 1.1)); }
  P_FG.lineTo(x + r * 1.3, 900); P_FG.closePath();
  for (let k = 0; k < 7; k++) { const bx = x + rr(-r, r), by = y - r * .35 * rr(.2, 1), h = rr(20, 55); P_FG.moveTo(bx, by + 4); P_FG.lineTo(bx + rr(-12, 12), by - h); P_FG.lineTo(bx + 3, by + 4); }
});
const PUDDLES = [[-240, 70, 44], [185, 118, 58], [-520, 205, 74], [430, 300, 84], [60, 385, 62], [-78, 24, 17], [720, 150, 50]];

// flora
const FLOW = [], GRASS_T = [];
(function () {
  for (let i = 0; i < 1350; i++) {
    let x, y, d, p;
    if (R0() < .8) { x = rr(-1350, 1950); y = Math.pow(R0(), 1.25) * 640 + 3; d = Math.hypot(x, (y - 40) * 2.2); p = .5 + y / 250; }
    else { x = rr(340, 2100); const s = slopeY(x); y = rr(s + 8, -6); d = Math.hypot(x, y - 40) * 1.05; p = .8; }
    if (Math.hypot(x, (y - 40) * 1.6) < 26) continue;
    FLOW.push({ x, y, d, p, c: Math.floor(R0() * FCOL.length), h: rr(5, 12), hr: rr(1.6, 3.3), ph: R0() * TAU });
  }
  for (let i = 0; i < 1900; i++) {

function score() {

  Kn(6.9, 69, .08); Kn(7.15, 71, .08); Kn(7.4, 74, .09); Kn(8.0, 76, .11);

  // II — the drops that never arrive
  Pd(14.2, [43, 55, 59, 62], 3.1, .028, 700); Bs(14.2, 43, 3, .06);
  at(15.1, x => whoosh(x, .45, .05, 500, 2200));
  Kn(15.45, 74, .09); Kn(15.62, 78, .09); Kn(15.79, 81, .1); Kn(15.96, 86, .09);
  Kn(16.7, 81, .06); Kn(17.05, 78, .055);
  Pd(17.5, [50, 54, 57, 62], 1.9, .028, 800);
  at(17.7, x => whoosh(x, 1.2, .07, 400, 3000));
  [74, 78, 81, 86, 85, 86, 90].forEach((m, i) => Kn(18.0 + i * .13, m, .08 + .01 * i));
  Pd(19.3, [40, 52, 55, 59], 3, .034, 600, 480); Bs(19.3, 40, 3, .07);
  Kn(19.7, 71, .09); Kn(20.2, 69, .08); Kn(20.7, 66, .075); Kn(21.4, 64, .075);
  DROPS.forEach(d => { const p = dropPhys(d); at(d.ts, x => plip(x, .018, 1900 + d.ox * 600)); at(d.ts + p.te, x => sizzle(x, .03)); });

  Pd(22, [43, 50, 57, 59, 62], 4.2, .03, 500, 1400); Bs(22, 43, 4, .06);
  at(21.9, x => whoosh(x, 3.2, .13, 200, 900, .7)); at(24.3, x => whoosh(x, 2.5, .1, 300, 1200, .7));
  Pd(26.3, [47, 54, 59, 62], 3.4, .028, 600, 700);
  Kn(26.55, 74, .085); Kn(26.85, 78, .075); Kn(27.15, 81, .075);
  Kn(28.15, 74, .085); Kn(28.6, 78, .075); Kn(29.1, 81, .07);
  at(29.85, x => whoosh(x, 2.6, .17, 250, 2600, .9));
  Bl(29.95, 86, .07); Pd(29.9, [50, 57, 62, 66, 69], 1.3, .04, 900, 2000);
  // IV — the climb
  const CH = [[31, [62, 66, 69, 74], 38], [33.2, [61, 64, 69, 73], 45], [34.9, [59, 62, 66, 71], 47], [36.3, [55, 59, 62, 67], 43], [37.5, [57, 61, 64, 69], 45]];
  CH.forEach(([t0, ms, b], i) => { const d = (CH[i + 1] ? CH[i + 1][0] : 39) - t0; Pd(t0, ms.map(m => m - 12), d, .026 + i * .009, 600 + i * 400, 900 + i * 450); Bs(t0, b, d, .07 + i * .012); });

  Pd(45.02, [38, 50, 57, 62, 66, 69, 74], 3.8, .055, 1200, 2600); Bs(45.02, 38, 4, .14); Bs(45.02, 26, 4, .09);
  for (let i = 0; i < 26; i++) { const v = .3 * (1 - i / 28) * (.65 + .35 * hash(i)); at(45.06 + i * .12, x => drum(x, v)); }

  Bl(53.6, 86, .055); Bl(54.05, 90, .055); Bl(54.5, 93, .055);
  Pd(56.5, [50, 57, 62, 66, 69], 2, .048, 1500, 2800); Bs(56.5, 38, 2, .12); Pd(58.4, [43, 55, 59, 62, 67], 2.2, .048, 1600, 2800); Bs(58.4, 43, 2, .12);
  motif(56.6, .8, .12);
  const pent = [74, 76, 78, 81, 83, 86, 88, 90, 93, 95, 98];
  pent.forEach((m, i) => { Bl(56.85 + i * .17, m, .04); Bl(58.75 + i * .14, m, .04); });

  HOPS.forEach((h, i) => { at(h, x => boing(x, .1)); Kn(h + .02, [86, 88, 90][i], .075); });
  [[65.2, 83], [65.5, 81], [65.8, 78], [66.15, 76], [66.5, 74]].forEach(([t0, m]) => Kn(t0, m, .085));

}

function audioInit() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  NB.white = mkNoise('white', 3); NB.pink = mkNoise('pink', 4); NB.brown = mkNoise('brown', 5); IR = mkIR(3.4);
}
function audioStart(off) {
  if (A.out) { try { A.out.gain.cancelScheduledValues(0); A.out.gain.setValueAtTime(0, AC.currentTime); } catch (e) { } const old = A.out; setTimeout(() => { try { old.disconnect(); } catch (e) { } }, 100); A.srcs.forEach(s => { try { s.stop(); } catch (e) { } }); }

  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .25;
  const lim = AC.createDynamicsCompressor(); lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .002; lim.release.value = .12;
  comp.connect(out); out.connect(lim); lim.connect(AC.destination);
  const rev = AC.createConvolver(); rev.buffer = IR; const revG = AC.createGain(); revG.gain.value = .55; rev.connect(revG); revG.connect(comp);
  A.mus = AC.createGain(); A.mus.gain.value = .85; A.mus.connect(comp); const ms = AC.createGain(); ms.gain.value = .55; A.mus.connect(ms); ms.connect(rev);
  A.sfx = AC.createGain(); A.sfx.gain.value = .9; A.sfx.connect(comp); const ss = AC.createGain(); ss.gain.value = .22; A.sfx.connect(ss); ss.connect(rev);
  A.out = out;
  env(out.gain, [[0, 0], [.8, .9], [66.3, .9], [67.5, 0], [99, 0]]);
  const s0 = T(A.off), dur = END + 2 - A.off;
  // desert wind bed
  { const n = noiseSrc(NB.brown, s0, dur), f = biq('bandpass', 380, .6), lfo = AC.createOscillator(), lg = AC.createGain(), g = AC.createGain();
    lfo.frequency.value = .08; lg.gain.value = 160; lfo.connect(lg); lg.connect(f.frequency); lfo.start(s0); lfo.stop(s0 + dur); reg(lfo);
    n.connect(f).connect(g).connect(A.sfx);
    env(g.gain, [[0, 0], [1.5, .22], [21, .22], [22.5, .42], [30, .55], [36, .4], [39, .25], [44.3, .05], [45, .2], [52, .12], [56, .06], [66, .03], [67.5, 0]]); }
  // heat shimmer + cicada-like tremble
  { const n = noiseSrc(NB.white, s0, dur), f = biq('highpass', 6500), g = AC.createGain(); n.connect(f).connect(g).connect(A.sfx);
    env(g.gain, [[0, 0], [2, .03], [20, .028], [25, 0]]);
    const o = AC.createOscillator(); o.frequency.value = 4700; const am = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain(), g2 = AC.createGain();
    am.gain.value = 0; lfo.frequency.value = 31; lg.gain.value = 1; lfo.connect(lg); lg.connect(am.gain); o.connect(am); am.connect(g2); g2.connect(A.sfx);
    env(g2.gain, [[0, 0], [2.5, .006], [13, .006], [15, .0035], [21, .003], [23, 0]]);
    o.start(s0); o.stop(s0 + dur); lfo.start(s0); lfo.stop(s0 + dur); reg(o); reg(lfo); }
  // rain
  { const n = noiseSrc(NB.pink, s0, dur), f = biq('lowpass', 6500), f2 = biq('highpass', 280), g = AC.createGain(); n.connect(f).connect(f2).connect(g).connect(A.sfx);
    env(g.gain, [[0, 0], [44.95, 0], [45.3, .5], [49.5, .5], [51.5, .42], [53, .14], [54.5, 0]]);
    const n2 = noiseSrc(NB.brown, s0, dur), f3 = biq('lowpass', 380), g2 = AC.createGain(); n2.connect(f3).connect(g2).connect(A.sfx);
    env(g2.gain, [[0, 0], [44.95, 0], [45.3, .3], [49.5, .3], [53, .08], [54.5, 0]]); }

  { const f = biq('lowpass', 190), g = AC.createGain(); f.connect(g); g.connect(A.mus);
    [36.7, 55, 73.4].forEach((fr, i) => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = i * 5; o.connect(f); o.start(s0); o.stop(s0 + dur); reg(o); });
    env(g.gain, [[0, 0], [37.5, 0], [41, .09], [44.3, .11], [44.8, 0], [45, .1], [49.5, 0]]);

}

/* ---------------- playback ---------------- */
const params = new URLSearchParams(location.search);
const STILL = params.has('t') ? parseFloat(params.get('t')) : null;
let playing = false, fallbackStart = 0, fallbackOff = 0;
function filmTime() {
  if (AC && A.t0 !== undefined) return Math.max(A.off, AC.currentTime - A.t0 + A.off);
  return (performance.now() - fallbackStart) / 1000 + fallbackOff;
}
function loop() {
  const t = filmTime();
  render(Math.min(t, END + 5));
  requestAnimationFrame(loop);
}
function begin(off = 0) {
  try { if (!AC) audioInit(); if (AC.state === 'suspended') AC.resume(); audioStart(off); }
  catch (e) { console.warn('audio unavailable', e); AC = null; fallbackStart = performance.now(); fallbackOff = off; }

}
const startEl = document.getElementById('start');
function launch() {
  startEl.style.opacity = 0; setTimeout(() => startEl.style.display = 'none', 1000);
  const go = () => begin(parseFloat(params.get('seek')) || 0);
  (document.fonts && document.fonts.load ? document.fonts.load('300 60px "Cormorant Garamond"').catch(() => { }) : Promise.resolve()).then(go, go);
}
startEl.addEventListener('click', launch, { once: true });
cv.addEventListener('click', () => { if (playing && filmTime() > END - .2) begin(0); });
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { }); else document.exitFullscreen(); }
  if (!playing) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); launch(); } return; }
  if (e.key === ' ') { e.preventDefault(); if (AC) AC.state === 'running' ? AC.suspend() : AC.resume(); }
  if (e.key === 'r' || e.key === 'R') begin(0);
  if (e.key === 'ArrowRight') begin(Math.min(END - 1, filmTime() + 5));
  if (e.key === 'ArrowLeft') begin(Math.max(0, filmTime() - 5));
});
addEventListener('resize', resize);
resize();
if (params.has('audiotest')) {
  startEl.style.display = 'none';
  const sr = 22050; AC = new OfflineAudioContext(2, sr * 73, sr);
  NB.white = mkNoise('white', 3); NB.pink = mkNoise('pink', 4); NB.brown = mkNoise('brown', 5); IR = mkIR(3.4);
  audioStart(0);
  const n0 = A.srcs.length;
  AC.startRendering().then(b => {
    const d = b.getChannelData(0), out = [];
    for (let s = 0; s < 73; s += 1) { let pk = 0, sq = 0; for (let i = s * sr; i < (s + 1) * sr; i++) { const v = Math.abs(d[i]); pk = Math.max(pk, v); sq += v * v; } out.push(s + ':' + pk.toFixed(2) + '/' + Math.sqrt(sq / sr).toFixed(3)); }
    document.title = 'AUDIO nodes=' + n0 + ' ' + out.join(' ');
  }).catch(e => document.title = 'ERR render ' + e);
}
if (STILL !== null) {
  startEl.style.display = 'none';
  window.onerror = (m, s, l) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'red'; ctx.font = '20px monospace'; ctx.fillText(m + ' @' + l, 20, 40); };
  render(STILL);
  const again = () => { render(STILL); requestAnimationFrame(again); }; requestAnimationFrame(again);
  if (params.has('dbg')) { const d = ctx.getImageData(cv.width / 2, cv.height / 2, 1, 1).data; document.title = `px ${d[0]},${d[1]},${d[2]} size ${cv.width}x${cv.height} K=${K}`; }
}

/* ---------------- film contract (tools/lib/film.mjs) ---------------- */
window.__film = {
  duration: END,
  renderAt(t) { render(t); },
  chapters: [{ t: 0, title: 'Sağanak' }],
  async sound(from, to) {
    const sr = 48000;
    AC = new OfflineAudioContext(2, Math.ceil((to - from) * sr), sr);
    NB.white = mkNoise('white', 3); NB.pink = mkNoise('pink', 4); NB.brown = mkNoise('brown', 5); IR = mkIR(3.4);

if (params.has('video')) { startEl.style.display = 'none'; render(0); }

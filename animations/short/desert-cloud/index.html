<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sağanak · sözsüz kısa film</title>
<meta name="description" content="Çölde kurumuş bir tomurcuğa yağmur yağdırmak isteyen avuç kadar bir bulut, rüzgârla yükselip dev bir fırtınaya dönüşür.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<link rel="stylesheet" href="./src/style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="title"><span>SAĞANAK</span></div>
  <div id="start">
    <div class="card">
      <h1>Sağanak</h1>
      <p class="sub">sözsüz bir kısa film · bir dakika</p>
      <button id="go" disabled><span class="lbl">Hazırlanıyor…</span></button>
      <div id="prep"><i></i></div>
      <p class="hint">sesi açık izleyin</p>
    </div>
  </div>
  <div id="bar">
    <button id="bPlay" aria-label="Oynat / duraklat"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4.5h4.2v15H6zm7.8 0H18v15h-4.2z"/></svg><svg class="i-again" viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.7A5 5 0 1 0 12 7v3L7.5 6 12 2z"/></svg></button>
    <div id="progress"><div id="fill"></div></div>
    <span id="time">0:00 / 1:06</span>
    <button id="bFull" aria-label="Tam ekran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z"/></svg></button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

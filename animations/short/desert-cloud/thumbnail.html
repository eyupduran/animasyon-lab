<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sağanak · kapaklar</title>
</head>
<body>
<div id="root"></div>
<script type="module">
// Covers for `npm run thumbnail -- desert-cloud`. The hero pictures are stills of the film itself
// (thumbs/*.jpg, rendered with ?cam=… from the video path), laid under the channel's shared brand.
import * as kit from '/_kit/kit.js';
const COVERS = [
  { id: 'dev', title: 'KÜÇÜK BULUT *DEV* OLDU', accent: 'çölde bir tomurcuk için', tint: '#FF4FA0' },
  { id: 'storm', title: 'ÇÖLE *SAĞANAK*', accent: 'avuç kadar bir buluttan', tint: '#6B5CFF' },
  { id: 'bow', title: 'KANYON *ÇİÇEK* AÇTI', accent: 'bir bulutun yağmuruyla', tint: '#FF9A5C' },
  { id: 'drop', title: 'YALNIZCA *DÖRT DAMLA*', accent: 'yetmedi…', tint: '#FF7A3D' },
  { id: 'joy', title: '*SAĞANAK*', accent: 'sözsüz bir kısa film', tint: '#FF6FB0' },
];
const v = Math.max(1, Math.min(COVERS.length, Number(new URLSearchParams(location.search).get('v')) || 1));
const c = COVERS[v - 1];
const img = new Image();
img.src = `./thumbs/${c.id}.jpg`;
await img.decode();
const ctx = kit.layer(1);
ctx.drawImage(img, 0, 0, kit.W, kit.H);
kit.brand({ title: c.title, accent: c.accent, topic: 'KISA FİLM', minutes: 1, tint: c.tint });
await kit.ready();
window.__thumbs = { count: COVERS.length, list: COVERS.map(({ id, title }) => ({ id, title })) };
window.__thumbReady = true;
</script>
</body>
</html>
